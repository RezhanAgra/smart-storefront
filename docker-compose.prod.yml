# Produksi: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: smart-storefront-prod

services:
  mongo:
    image: mongo:7
    # Prisma butuh replica set. Tidak ada port yang dibuka ke host: hanya bisa diakses dari jaringan smart_net.
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    restart: unless-stopped
    volumes:
      - mongo_prod_data:/data/db
    networks: [smart_net]
    healthcheck:
      # Inisialisasi replica set sekali, lalu sehat hanya jika node sudah PRIMARY (siap ditulis).
      # Host "mongo:27017" adalah nama service yang dipakai server.
      test:
        - CMD
        - mongosh
        - --port=27017
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 30

  server:
    build:
      context: ./server
      target: runner
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: "5000"
    volumes:
      - uploads_prod_data:/app/uploads
      - private_uploads_prod_data:/app/private-uploads
    networks: [smart_net]
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        # Client menambahkan /api sendiri, jadi cukup origin-nya.
        PUBLIC_API_URL: https://${DOMAIN_NAME}
        SITE_URL: https://${DOMAIN_NAME}
    restart: unless-stopped
    environment:
      # SSR memanggil API lewat jaringan internal, tidak memutar lewat Caddy.
      INTERNAL_API_URL: http://server:5000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks: [smart_net]
    depends_on:
      server:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [smart_net]
    depends_on:
      - client
      - server

  # Alat sekali-jalan (tidak ikut `up`): prisma db push dan seed toko demo.
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm migrate
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm migrate npm run seed
  migrate:
    build:
      context: ./server
      target: builder
    profiles: [tools]
    env_file: .env.prod
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    networks: [smart_net]
    depends_on:
      mongo:
        condition: service_healthy

networks:
  smart_net:
    driver: bridge

volumes:
  mongo_prod_data:
  uploads_prod_data:
  private_uploads_prod_data:
  caddy_data:
  caddy_config:
